name: Release

# Merging a labelled pull request into main ships it: the label (major/minor/
# patch, or no-release to skip) says how the version moves, and the tag is
# created by the publish step at the end — so a build that falls over leaves no
# tag pointing at a release that is not coming.
#
# The old ways still work. Push a tag:  git tag v1.2.3 && git push origin v1.2.3
# Or run this workflow manually with a bump kind, or an exact version.
#
# Note the merge path needs the pull request to come from a branch in this repo,
# not a fork: GITHUB_TOKEN is read-only on fork pull requests and cannot publish.
# Release a fork's work by pushing the tag once it is on main.
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: How to move the version
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 'Or an exact version, without the leading v (e.g. 1.2.3)'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve the version
    # A pull request that was closed without merging is not a release.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
      skip: ${{ steps.kind.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit on main, not refs/pull/N/merge — that ref is gone
          # once the pull request closes.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          # next_version.sh reads the tag list; a shallow clone fetches none.
          fetch-depth: 0

      - name: Commit to release
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Which way does the version move
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          case "${{ github.event_name }}" in
            pull_request)     kind="$(./scripts/select_bump.sh)" ;;
            workflow_dispatch) kind="${{ inputs.bump }}" ;;
            *)                kind="tag" ;;  # the tag already names the version
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = none ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no-release label set — merged without cutting a release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: version
        if: steps.kind.outputs.skip != 'true'
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          EXACT: ${{ inputs.version }}
        run: |
          if [ -n "$EXACT" ]; then
            VERSION="${EXACT#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          else
            # Writes version= and tag= to $GITHUB_OUTPUT itself.
            VERSION="$(./scripts/next_version.sh "$KIND")"
          fi
          echo "Releasing $VERSION"

  release:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-26

    env:
      # Signing and notarization are optional: with no secrets set the build
      # still succeeds, ad-hoc signed. See scripts/setup_signing.sh.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # Notarization takes either an App Store Connect API key…
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # …or an Apple ID with an app-specific password, which needs no API
      # access request. Either set is enough.
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          # A throwaway keychain, unlocked for this job only.
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f /tmp/cert.p12
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          security find-identity -v -p codesigning build.keychain

      - name: Build app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        # make_app.sh picks Developer ID when the certificate imported above is
        # present (hardened runtime + entitlements), else falls back to ad-hoc.
        run: make app

      - name: Verify the bundle runs
        run: build/Pawvis.app/Contents/MacOS/Pawvis --selftest

      - name: Notarize and staple
        if: env.NOTARY_KEY_P8 != '' || env.NOTARY_APPLE_ID != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          # Notarization takes a zip; the ticket is stapled to the .app after.
          ditto -c -k --keepParent build/Pawvis.app dist/notarize.zip

          if [ -n "$NOTARY_KEY_P8" ]; then
            echo "$NOTARY_KEY_P8" | base64 --decode > /tmp/notary.p8
            xcrun notarytool submit dist/notarize.zip \
              --key /tmp/notary.p8 \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m
            rm -f /tmp/notary.p8
          else
            xcrun notarytool submit dist/notarize.zip \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID" \
              --wait --timeout 30m
          fi

          rm -f dist/notarize.zip
          xcrun stapler staple build/Pawvis.app
          # Proves a fresh download will launch without a Gatekeeper prompt.
          spctl -a -vv -t exec build/Pawvis.app

      - name: Package
        run: |
          mkdir -p dist
          # The asset name is deliberately fixed, not versioned: it makes
          # https://github.com/alexandriax/pawvis/releases/latest/download/Pawvis.zip
          # a permanent download link (the README's button), and leaves exactly
          # one .zip per release for the in-app updater to choose.
          # ditto --keepParent preserves the bundle structure, its signature,
          # and (after stapling) the notarization ticket.
          ditto -c -k --keepParent build/Pawvis.app dist/Pawvis.zip
          # Checksum from inside dist/ so the file names the zip alone — a
          # path prefix here would break `shasum -c` for anyone verifying.
          (cd dist && shasum -a 256 Pawvis.zip | tee Pawvis.zip.sha256)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # Creates the tag here, at the merge commit, when it does not already
          # exist. Needed explicitly: on a pull_request event github.sha is the
          # merge *ref*, which is not on main and would tag the wrong commit.
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: Pawvis ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Pawvis.zip
            dist/Pawvis.zip.sha256
          body: |
            **Install:** download `Pawvis.zip`, unzip, and drag Pawvis.app to Applications.

            Pawvis can update itself from here — Settings → About → Check Now.
