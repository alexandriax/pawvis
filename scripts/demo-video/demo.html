<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('../../docs/assets/fonts/bricolage-grotesque-var-latin.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Inter'; src: url('../../docs/assets/fonts/inter-var-latin.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../docs/assets/fonts/instrument-serif-italic-latin.woff2') format('woff2'); font-style: italic; font-weight: 400; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../docs/assets/fonts/jetbrains-mono-var-latin.woff2') format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; background: #0A0714; overflow: hidden; }
  svg { display: block; } text { user-select: none; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
'use strict';
// ================================================================ constants
const W = 1920, H = 1080;
const PURPLE = '#8B5CF6', PURPLE_L = '#C4B5FD', BLUE = '#0EA5E9', BLUE_L = '#7DD3FC';
const BG = '#0A0714', PANEL = '#171129', PANEL_HI = '#1E1838', LINE = 'rgba(196,181,253,0.15)';
const INK = '#EFECF8', INK2 = '#BCB4D2', DIM = '#8E86A8';
const SKIN = '#C98A5E', SKIN_D = '#A96F45', HAIR = '#231831';
const AMBER = '#FFB86B', PINK = '#F472B6', GREEN = '#34D399', RED = '#FB7185';
const SWEATER = '#6244D9', SWEATER_D = '#4F33BE';
const FD = 'Bricolage Grotesque', FB = 'Inter', FS = 'Instrument Serif', FM = 'JetBrains Mono';
const TIP_COLORS = { t: AMBER, i: BLUE_L, m: PURPLE_L, r: PURPLE, p: PINK };
const TL = { s1:[0,6], s2:[6,22.8], s3:[22.8,31.2], s4:[31.2,39.6], s5:[39.6,46.5],
             s6:[46.5,55], s7:[55,66.3], s8:[66.3,78.4], s9:[78.4,87.5] };
const DUR = 87.5;

// ================================================================ helpers
const NS = 'http://www.w3.org/2000/svg';
function el(n, a, p) { const e = document.createElementNS(NS, n); if (a) for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function grp(p, a) { return el('g', a || {}, p); }
function label(p, o, str) {
  const e = el('text', {
    x: o.x || 0, y: o.y || 0, 'font-family': `'${o.f || FB}'`, 'font-size': o.s || 30,
    'font-weight': o.w || 600, fill: o.fill || INK, 'text-anchor': o.a || 'middle',
    'letter-spacing': o.ls || 0, 'font-style': o.it ? 'italic' : 'normal', opacity: o.o == null ? 1 : o.o,
  }, p);
  e.textContent = str; return e;
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lin = x=>x, eo = x=>1-Math.pow(1-x,3), ei = x=>x*x*x, eio = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const xo = x=>x>=1?1:1-Math.pow(2,-10*x);                          // expo out
const back = x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const spring = x=>x>=1?1:1-Math.exp(-5.2*x)*Math.cos(9*x);        // damped pop
function K(t, stops, ez) {
  ez = ez || eio;
  if (t <= stops[0][0]) return stops[0][1];
  const n = stops.length;
  if (t >= stops[n-1][0]) return stops[n-1][1];
  for (let i = 0; i < n-1; i++) {
    const a = stops[i][0], va = stops[i][1], b = stops[i+1][0], vb = stops[i+1][1];
    if (t < b) { const u = (t-a)/(b-a); return va + (vb-va)*ez(u); }
  }
  return stops[n-1][1];
}
function setT(e, x, y, s, r) { e.setAttribute('transform', `translate(${x} ${y}) rotate(${r||0}) scale(${s==null?1:s})`); }
function O(e, o) { e.setAttribute('opacity', clamp(o, 0, 1)); }
function fadeIO(e, t, a, b, c, d) {
  let o;
  if (t < a) o = 0; else if (t < b) o = (t-a)/(b-a); else if (c == null || t < c) o = 1;
  else if (t < d) o = 1-(t-c)/(d-c); else o = 0;
  O(e, o); return o;
}
// camera punch: returns scale for a punch event at time p
function punch(t, p) { const d = t - p; if (d < 0 || d > .5) return 0; return d < .1 ? xo(d/.1) : 1 - eio((d-.1)/.4); }
let CLIPN = 0;
function clipRect(x, y, w, h, rx) {
  const id = 'c' + (++CLIPN);
  const cp = el('clipPath', { id }, defs);
  el('rect', { x, y, width: w, height: h, rx: rx || 0 }, cp);
  return `url(#${id})`;
}

// ================================================================ defs
const stage = document.getElementById('stage');
const defs = el('defs', {}, stage);
function gradStops(g, stops) { for (const [off, col, op] of stops) el('stop', { offset: off, 'stop-color': col, 'stop-opacity': op == null ? 1 : op }, g); }
const bgR = el('radialGradient', { id:'bgR', cx:.5, cy:.42, r:.85 }, defs);
gradStops(bgR, [['0%', '#161038'], ['55%', '#0E0A20'], ['100%', '#080511']]);
const brand = el('linearGradient', { id:'brand', x1:0, y1:0, x2:1, y2:0 }, defs);
gradStops(brand, [['0%', PURPLE_L], ['32%', PURPLE], ['78%', BLUE], ['100%', BLUE_L]]);
const brandV = el('linearGradient', { id:'brandV', x1:0, y1:0, x2:0, y2:1 }, defs);
gradStops(brandV, [['0%', PURPLE], ['100%', '#1D4ED8']]);
const wall = el('linearGradient', { id:'wall', x1:0, y1:0, x2:1, y2:1 }, defs);
gradStops(wall, [['0%', '#332766'], ['48%', '#28296B'], ['100%', '#153B69']]);
const wall2 = el('linearGradient', { id:'wall2', x1:0, y1:0, x2:1, y2:1 }, defs);
gradStops(wall2, [['0%', '#3A2B72'], ['100%', '#1D4470']]);
const glowP = el('radialGradient', { id:'glowP' }, defs); gradStops(glowP, [['0%', PURPLE, .34], ['100%', PURPLE, 0]]);
const glowB = el('radialGradient', { id:'glowB' }, defs); gradStops(glowB, [['0%', BLUE, .26], ['100%', BLUE, 0]]);
const glowW = el('radialGradient', { id:'glowW' }, defs); gradStops(glowW, [['0%', AMBER, .22], ['100%', AMBER, 0]]);
const cone = el('linearGradient', { id:'cone', x1:0, y1:0, x2:1, y2:0 }, defs);
gradStops(cone, [['0%', BLUE_L, .32], ['100%', BLUE_L, 0]]);
const vin = el('radialGradient', { id:'vin', cx:.5, cy:.45, r:.78 }, defs);
gradStops(vin, [['0%', '#000', 0], ['70%', '#000', 0], ['100%', '#030109', .66]]);
const leak = el('linearGradient', { id:'leak', x1:0, y1:0, x2:1, y2:1 }, defs);
gradStops(leak, [['0%', PURPLE_L, .07], ['30%', PURPLE_L, 0], ['100%', PURPLE_L, 0]]);
const skinG = el('linearGradient', { id:'skinG', x1:0, y1:0, x2:1, y2:0 }, defs);
gradStops(skinG, [['0%', SKIN], ['78%', SKIN], ['100%', '#B97952']]);
const shLg = el('filter', { id:'shLg', x:'-45%', y:'-45%', width:'190%', height:'190%' }, defs);
el('feDropShadow', { dx:0, dy:22, stdDeviation:28, 'flood-color':'#030109', 'flood-opacity':.6 }, shLg);
const shSm = el('filter', { id:'shSm', x:'-45%', y:'-45%', width:'190%', height:'190%' }, defs);
el('feDropShadow', { dx:0, dy:8, stdDeviation:12, 'flood-color':'#030109', 'flood-opacity':.5 }, shSm);
const shHand = el('filter', { id:'shHand', x:'-60%', y:'-60%', width:'220%', height:'220%' }, defs);
el('feDropShadow', { dx:0, dy:16, stdDeviation:20, 'flood-color':'#030109', 'flood-opacity':.42 }, shHand);
// animated film grain
const grainF = el('filter', { id:'grain', x:'0%', y:'0%', width:'100%', height:'100%' }, defs);
const turb = el('feTurbulence', { type:'fractalNoise', baseFrequency:'0.71', numOctaves:2, seed:7, stitchTiles:'stitch', result:'n' }, grainF);
el('feColorMatrix', { in:'n', type:'matrix', values:'0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 1  0 0 0 0.6 0' }, grainF);

// ================================================================ background
el('rect', { width: W, height: H, fill: 'url(#bgR)' }, stage);
const bgG = grp(stage);
const orbA = el('ellipse', { cx:380, cy:210, rx:700, ry:460, fill:'url(#glowP)' }, bgG);
const orbB = el('ellipse', { cx:1600, cy:920, rx:760, ry:500, fill:'url(#glowB)' }, bgG);
const orbC = el('ellipse', { cx:1250, cy:120, rx:420, ry:280, fill:'url(#glowP)', opacity:.5 }, bgG);
const dotsG = grp(bgG, { opacity:.55 });
for (let i = 0; i < 32; i++) for (let j = 0; j < 18; j++) {
  if ((i*7 + j*13) % 6 < 4) continue;
  el('circle', { cx: i*62+18, cy: j*62+14, r: 1.5, fill: PURPLE_L, opacity: .06 }, dotsG);
}

// ================================================================ claw cursor / glyph
const PAD_D = 'M -40 6 C -40 -8 -33 -15 -25 -17 C -27 -30 -14 -36 -7 -27 C -4 -38 10 -38 13 -27 C 20 -35 32 -29 30 -17 C 37 -14 42 -7 42 5 C 42 27 24 40 1 40 C -22 40 -40 27 -40 6 Z';
const TALON_D = 'M -6 -2 C -10 -22 -6 -40 0 -50 C 5 -40 8 -22 5 -2 C 2 3 -3 3 -6 -2 Z';
function clawShape(p, fill, outline) {
  const g = grp(p);
  const talons = grp(g), pad = grp(g);
  const oa = outline ? { stroke: 'rgba(8,5,17,0.45)', 'stroke-width': 3 } : {};
  for (const [dx, dy, rot, sc] of [[-25,-14,-16,.92],[1,-20,0,1.06],[26,-14,16,.92]])
    el('path', { d: TALON_D, fill, transform:`translate(${dx} ${dy}) rotate(${rot}) scale(${sc})`, ...oa }, talons);
  el('path', { d: PAD_D, fill, ...oa }, pad);
  return { g, talons, pad };
}
function makeClaw(p, scale) {
  const g = grp(p);
  const s = grp(g); s.setAttribute('transform', `scale(${scale})`);
  const ring = el('circle', { r: 74, fill:'none', stroke: BLUE_L, 'stroke-width': 8, opacity: 0 }, s);
  const body = clawShape(s, '#FFFFFF', true);
  body.g.setAttribute('filter', 'url(#shSm)');
  return { g, ring,
    fill(c) { for (const n of [...body.talons.children, ...body.pad.children]) n.setAttribute('fill', c); },
    retract(k) { body.talons.setAttribute('transform', `translate(0 ${k*17}) scale(1 ${1-k*.5})`); } };
}
function clawGlyph(p, scale, fill) { // brand mark for chips
  const g = grp(p);
  const s = grp(g); s.setAttribute('transform', `scale(${scale})`);
  clawShape(s, fill, false);
  return g;
}

// ================================================================ articulated hand v3 — unified silhouette
// pose: per finger [baseAngle, len(0..1), hook(deg)]
const POSES = {
  open:   { t:[-52,1,0],    i:[-11,1,0],   m:[0,1,0],    r:[10,1,0],   p:[23,1,0]   },
  dip:    { t:[-52,1,0],    i:[-8,.97,95], m:[0,1,0],    r:[10,1,0],   p:[23,1,0]   },
  fist:   { t:[-26,.6,52],  i:[-5,.24,0],  m:[0,.24,0],  r:[8,.24,0],  p:[18,.26,0] },
  shaka:  { t:[-80,1.08,-20],i:[-6,.24,0], m:[0,.23,0],  r:[8,.23,0],  p:[35,1.05,-12] },
  scroll: { t:[-52,.9,0],   i:[-11,1,0],   m:[0,.26,0],  r:[8,.26,0],  p:[23,1,0]   },
  peace:  { t:[-30,.62,50], i:[-16,1.03,0],m:[3,1.03,0], r:[10,.26,0], p:[22,.26,0] },
  thumbR: { t:[-84,.96,0], i:[-5,.24,0],  m:[0,.24,0],  r:[8,.24,0],  p:[18,.26,0] },
};
const FDEF3 = {
  t: { bx:-56, by:30,  hw:18.5, L:104 },
  i: { bx:-51, by:-58, hw:17,   L:114 },
  m: { bx:-17, by:-64, hw:17.5, L:126 },
  r: { bx:17,  by:-60, hw:16.5, L:116 },
  p: { bx:49,  by:-48, hw:14.5, L:90  },
};
const RAD = d => d*Math.PI/180;
function fingerFrame(k, px) {
  const f = FDEF3[k], a = RAD(px[k][0]);
  return { f, a, len: px[k][1], hook: px[k][2],
    dir: [Math.sin(a), -Math.cos(a)], nrm: [Math.cos(a), Math.sin(a)] };
}
function handTip(px, k) {
  const { f, a, len, hook } = fingerFrame(k, px);
  const Lp = f.L*.56, Ld = f.L*.44, h = RAD(hook);
  const vx = (Ld*len)*Math.sin(h), vy = -(Ld*len)*Math.cos(h);
  const lx = vx, ly = -Lp*len + vy;
  return [f.bx + lx*Math.cos(a) - ly*Math.sin(a), f.by + lx*Math.sin(a) + ly*Math.cos(a)];
}
function mixPose(a, b, u) {
  const out = {};
  for (const k of ['t','i','m','r','p'])
    out[k] = [0,1,2].map(j => a[k][j] + (b[k][j]-a[k][j])*u);
  return out;
}
function makeHand(p, opt) {
  opt = opt || {};
  const scale = opt.scale || 1, skin = opt.skin || SKIN;
  const g = grp(p);
  const root = grp(g); root.setAttribute('transform', `scale(${scale})`);
  if (!opt.noShadow) root.setAttribute('filter', 'url(#shHand)');
  // forearm behind everything
  el('rect', { x:-49, y:100, width:98, height:190, rx:30, fill: opt.sleeve || SWEATER }, root);
  el('rect', { x:-49, y:100, width:26, height:190, rx:13, fill: SWEATER_D, opacity:.55 }, root);
  // unified palm+finger silhouette
  const sil = el('path', { fill: skin }, root);
  const clipId = 'hclip' + (++CLIPN);
  const hcp = el('clipPath', { id: clipId }, defs);
  const clipSil = el('path', {}, hcp);
  const clipThumb = el('path', {}, hcp);
  const shadeG = grp(root, { 'clip-path': `url(#${clipId})` });
  el('ellipse', { cx:30, cy:44, rx:84, ry:90, fill: SKIN_D, opacity:.15 }, shadeG);
  el('ellipse', { cx:-4, cy:8, rx:44, ry:34, fill: SKIN_D, opacity:.07 }, shadeG);
  const creases = grp(root);
  el('path', { d:'M -34 2 Q 0 14 32 6', fill:'none', stroke:SKIN_D, 'stroke-width':3, 'stroke-linecap':'round', opacity:.17 }, creases);
  el('path', { d:'M -30 30 Q 2 40 32 32', fill:'none', stroke:SKIN_D, 'stroke-width':3, 'stroke-linecap':'round', opacity:.13 }, creases);
  el('path', { d:'M -42 22 Q -32 46 -14 60', fill:'none', stroke:SKIN_D, 'stroke-width':3, 'stroke-linecap':'round', opacity:.13 }, creases);
  // wristbands over the wrist (echoing the icon)
  el('rect', { x:-58, y:74, width:116, height:25, rx:12.5, fill: PURPLE }, root);
  el('rect', { x:-58, y:102, width:116, height:24, rx:12, fill: BLUE }, root);
  const thumbShadow = el('path', { fill:'#4A2E18', opacity:.10, transform:'translate(5 9)' }, root);
  const thumb = el('path', { fill: skin }, root);
  // articulated distal overlays + fold creases
  const over = {}, folds = {};
  for (const k of ['t','i','m','r','p']) {
    const og = grp(root); og.style.display = 'none';
    const f = FDEF3[k];
    el('circle', { r: f.hw*.9, fill: skin }, og);
    el('rect', { x:-f.hw*.86, y:-(f.L*.44)-2, width:f.hw*1.72, height:f.L*.44+12, rx:f.hw*.86, fill: skin }, og);
    over[k] = og;
    folds[k] = el('path', { fill:'none', stroke:SKIN_D, 'stroke-width':2.6, 'stroke-linecap':'round', opacity:0 }, root);
  }
  // landmarks
  const lm = grp(root, { opacity: 0 });
  const lmLines = {}, lmDots = {};
  el('circle', { cx:0, cy:26, r:15, fill:'none', stroke:'#FFFFFF', 'stroke-width':3.4, opacity:.9 }, lm);
  for (const k of ['t','i','m','r','p']) {
    lmLines[k] = el('line', { x1:0, y1:26, x2:0, y2:-60, stroke:'#FFFFFF', 'stroke-width':2.4, opacity:.42 }, lm);
    lmDots[k] = el('circle', { r:7.5, fill: TIP_COLORS[k], stroke:'#FFFFFF', 'stroke-width':2.4 }, lm);
  }
  const P = (x, y) => x.toFixed(1) + ' ' + y.toFixed(1);
  const hand = {
    g, lm, tips:{},
    pose(px) {
      const fg = {};
      for (const k of ['i','m','r','p']) {
        const ff = fingerFrame(k, px);
        const { f, dir, nrm, len, hook } = ff;
        const hooked = Math.abs(hook) > 6;
        const sl = len * (hooked ? f.L*.56 : f.L);
        const tw = .86;
        fg[k] = {
          bl: [f.bx - nrm[0]*f.hw - dir[0]*8,  f.by - nrm[1]*f.hw - dir[1]*8],
          br: [f.bx + nrm[0]*f.hw - dir[0]*8,  f.by + nrm[1]*f.hw - dir[1]*8],
          tl: [f.bx - nrm[0]*f.hw*tw + dir[0]*sl, f.by - nrm[1]*f.hw*tw + dir[1]*sl],
          tr: [f.bx + nrm[0]*f.hw*tw + dir[0]*sl, f.by + nrm[1]*f.hw*tw + dir[1]*sl],
          cap: f.hw*1.18, dir,
        };
      }
      let d = `M ${P(fg.i.bl[0], fg.i.bl[1])} `;
      for (const k of ['i','m','r','p']) {
        const F2 = fg[k];
        d += `L ${P(F2.tl[0], F2.tl[1])} C ${P(F2.tl[0]+F2.dir[0]*F2.cap, F2.tl[1]+F2.dir[1]*F2.cap)} ${P(F2.tr[0]+F2.dir[0]*F2.cap, F2.tr[1]+F2.dir[1]*F2.cap)} ${P(F2.tr[0], F2.tr[1])} L ${P(F2.br[0], F2.br[1])} `;
        if (k !== 'p') {
          const nk = { i:'m', m:'r', r:'p' }[k];
          const vx = (F2.br[0] + fg[nk].bl[0]) / 2, vy = Math.max(F2.br[1], fg[nk].bl[1]) + 16;
          d += `Q ${P(vx, vy)} ${P(fg[nk].bl[0], fg[nk].bl[1])} `;
        }
      }
      d += `C 74 -8 66 54 46 88 L -50 88 C -88 42 -88 -14 ${P(fg.i.bl[0], fg.i.bl[1])} Z`;
      sil.setAttribute('d', d); clipSil.setAttribute('d', d);
      // thumb capsule
      {
        const ff = fingerFrame('t', px);
        const { f, dir, nrm, len, hook } = ff;
        const hooked = Math.abs(hook) > 16;
        const sl = len * (hooked ? f.L*.56 : f.L);
        const tw = .88, cap = f.hw*1.18;
        const bl = [f.bx - nrm[0]*f.hw - dir[0]*16, f.by - nrm[1]*f.hw - dir[1]*16];
        const br = [f.bx + nrm[0]*f.hw - dir[0]*16, f.by + nrm[1]*f.hw - dir[1]*16];
        const tl = [f.bx - nrm[0]*f.hw*tw + dir[0]*sl, f.by - nrm[1]*f.hw*tw + dir[1]*sl];
        const tr = [f.bx + nrm[0]*f.hw*tw + dir[0]*sl, f.by + nrm[1]*f.hw*tw + dir[1]*sl];
        const td = `M ${P(bl[0], bl[1])} L ${P(tl[0], tl[1])} C ${P(tl[0]+dir[0]*cap, tl[1]+dir[1]*cap)} ${P(tr[0]+dir[0]*cap, tr[1]+dir[1]*cap)} ${P(tr[0], tr[1])} L ${P(br[0], br[1])} Q ${P(f.bx - dir[0]*30, f.by - dir[1]*30)} ${P(bl[0], bl[1])} Z`;
        thumb.setAttribute('d', td); clipThumb.setAttribute('d', td);
        thumbShadow.setAttribute('d', td);
      }
      for (const k of ['t','i','m','r','p']) {
        const ff = fingerFrame(k, px);
        const { f, a, len, hook } = ff;
        const thr = k === 't' ? 16 : 6;
        if (Math.abs(hook) > thr) {
          const Lp = f.L*.56*len;
          const ox = f.bx + Lp*Math.sin(a), oy = f.by - Lp*Math.cos(a);
          over[k].style.display = '';
          over[k].setAttribute('transform', `translate(${ox} ${oy}) rotate(${px[k][0] + hook}) scale(1 ${len})`);
        } else over[k].style.display = 'none';
        if (k !== 't' && len < .5) {
          const tip = handTip(px, k);
          const w2 = f.hw*.62;
          folds[k].setAttribute('d', `M ${tip[0] - Math.cos(a)*w2} ${tip[1] + 7 - Math.sin(a)*w2} Q ${tip[0]} ${tip[1] + 11} ${tip[0] + Math.cos(a)*w2} ${tip[1] + 7 + Math.sin(a)*w2}`);
          folds[k].setAttribute('opacity', clamp((1-len)*.5, 0, .4));
        } else folds[k].setAttribute('opacity', 0);
        const tip = handTip(px, k);
        lmLines[k].setAttribute('x2', tip[0]); lmLines[k].setAttribute('y2', tip[1]);
        lmDots[k].setAttribute('cx', tip[0]); lmDots[k].setAttribute('cy', tip[1]);
        hand.tips[k] = tip;
      }
    },
    at(x, y, r) { setT(g, x, y, 1, r || 0); },
  };
  hand.pose(POSES.open);
  return hand;
}

// ================================================================ UI components
function macWindow(p, o) {
  const g = grp(p); setT(g, o.x, o.y);
  const bar = o.bar || 42;
  el('rect', { width:o.w, height:o.h, rx:14, fill: o.fill || PANEL, stroke: LINE, 'stroke-width':1.4,

    hand.pose(POSES.open); hand.at(hx, hy, 5*Math.sin(a + 1));

    const cxy = (aa) => [520 + 330*Math.sin(aa), 350 + 190*Math.sin(2*aa + .9)];
    const [ccx, ccy] = cxy(a);
    claw.g.setAttribute('transform', `translate(${ccx} ${ccy})`);

    for (let k = 2; k < 13; k++) { const [px, py] = cxy(a - k*.05); pts.push(px + ',' + py); }

    const qx = (1-pu)*(1-pu)*(hxAbs-90) + 2*(1-pu)*pu*((hxAbs+sxAbs)/2) + pu*pu*(sxAbs+26);

    O(pulseD, .95*bv); O(beam, .5*bv);
    for (const ic of icons) {
      const d = Math.hypot(ccx-ic.x, ccy-ic.y);

      O(ic.halo, near*.3);
      ic.g.setAttribute('transform', `translate(${ic.x} ${ic.y}) scale(${1 + near*.1})`);

  };
});
